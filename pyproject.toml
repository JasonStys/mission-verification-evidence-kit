# Jason Stys: bounded mission traceability with independent SQL verification.
[project]
name = "mission-verification-evidence-kit"
version = "1.0.0"
description = "Local requirements, test, fault and release evidence traceability by Jason Stys"
requires-python = ">=3.12,<3.15"
dependencies = []
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
[tool.coverage.run]
branch = true
source = ["evidencekit"]
[tool.coverage.report]
fail_under = 90
show_missing = true
[tool.mypy]
strict = true
python_version = "3.12"
files = ["evidencekit"]
